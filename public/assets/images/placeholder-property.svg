<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- House outline -->
  <g transform="translate(300,180)" opacity="0.3">
    <!-- Roof -->
    <polygon points="0,-80 100,0 -100,0" fill="none" stroke="#e4e95b" stroke-width="3"/>
    <!-- Walls -->
    <rect x="-70" y="0" width="140" height="90" fill="none" stroke="#e4e95b" stroke-width="3"/>
    <!-- Door -->
    <rect x="-20" y="40" width="40" height="50" fill="none" stroke="#e4e95b" stroke-width="2"/>
    <!-- Windows -->
    <rect x="-55" y="15" width="30" height="28" fill="none" stroke="#e4e95b" stroke-width="2"/>
    <rect x="25" y="15" width="30" height="28" fill="none" stroke="#e4e95b" stroke-width="2"/>
  </g>
  <!-- Label -->
  <text x="300" y="335" text-anchor="middle" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#e4e95b" opacity="0.8">Photo Coming Soon</text>
</svg>
